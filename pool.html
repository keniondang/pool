<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --card:#FFFFFF;
    --ink:#1A231D;
    --ink2:#5C6560;
    --ink3:#9AA09A;
    --line:#E8E4DA;
    --line2:#D6D1C4;
    --sage:#3F7358;
    --sage-bg:#E9F1EB;
    --sage-mid:#B4CFBE;
    --brass:#A8752E;
    --brass-bg:#F7EEDF;
    --brass-mid:#E3C79A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:15px;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .num{font-variant-numeric:tabular-nums;}
  .serif{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums;}
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 100px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin:0;letter-spacing:-.01em;}
  .eyebrow{font-size:11px;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;margin-bottom:3px;font-weight:500;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
  .topbar .meta{font-size:13px;color:var(--ink2);text-align:right;line-height:1.4;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px;}
  .card.flush{padding:0;overflow:hidden;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:12px;}
  .card-head .lhs{display:flex;align-items:center;gap:7px;}
  .card-head i{font-size:15px;color:var(--ink3);}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px 20px;margin-bottom:12px;}
  .hero-label{font-size:13px;color:var(--ink2);margin-bottom:8px;}
  .hero-num{font-family:'Fraunces',serif;font-weight:500;font-size:42px;line-height:1;letter-spacing:-.015em;color:var(--sage);font-variant-numeric:tabular-nums;}
  .hero-num .cur{font-size:17px;color:var(--ink3);margin-left:5px;font-family:'Inter',sans-serif;font-weight:450;}
  .hero-sub{font-size:13px;color:var(--ink3);margin-top:9px;}
  .meter{height:5px;background:var(--line);border-radius:99px;margin-top:16px;overflow:hidden;}
  .meter span{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .3s ease;}
  .meter.over span{background:var(--brass);}
  .meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:7px;}

  .banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.55;display:flex;gap:9px;align-items:flex-start;}
  .banner i{font-size:16px;flex-shrink:0;margin-top:1px;}
  .banner.safe{background:var(--sage-bg);color:#2C513E;}
  .banner.warn{background:var(--brass-bg);color:#78561F;}

  input,select{font-family:'Inter',sans-serif;font-size:15px;background:var(--paper);
    border:1px solid var(--line2);border-radius:11px;padding:11px 12px;color:var(--ink);width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg);}
  input::placeholder{color:var(--ink3);}
  .btn{font-family:'Inter',sans-serif;font-weight:500;font-size:14px;border-radius:11px;
    padding:11px 16px;cursor:pointer;border:1px solid transparent;}
  .btn.solid{background:var(--ink);color:#fff;}
  .btn.solid:active{opacity:.85;}
  .btn.outline{background:transparent;color:var(--ink2);border-color:var(--line2);}
  .btn.quiet{background:none;border:none;color:var(--sage);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px;}
  .btn.danger{background:transparent;color:#9A4A2E;border-color:#E0C4B8;}
  .btn:disabled{opacity:.4;cursor:default;}

  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px;}
  .chip{font-size:13.5px;font-weight:500;padding:10px 4px;text-align:center;border-radius:10px;
    background:#EBEEF0;border:1px solid #D8DDE0;color:#3C464C;cursor:pointer;
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .chip:active{background:#3C464C;border-color:#3C464C;color:#fff;}

  .logrow{display:flex;gap:8px;}
  .logrow input{flex:1;}

  .kv{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;}
  .kv + .kv{border-top:1px dashed var(--line);}
  .kv .v{font-variant-numeric:tabular-nums;}
  .kv.total{border-top:1px solid var(--line2);margin-top:5px;padding-top:10px;font-size:13px;color:var(--ink2);}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);}
  .stat{background:var(--card);padding:14px 16px;}
  .stat .l{font-size:11.5px;color:var(--ink3);letter-spacing:.03em;margin-bottom:4px;}
  .stat .v{font-family:'Fraunces',serif;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;}
  .stat .v.sage{color:var(--sage);}
  .stat .v.brass{color:var(--brass);}

  .daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px;}
  .daynav-mid{flex:1;text-align:center;line-height:1.3;}
  .daynav-mid .dn{display:block;font-family:'Fraunces',serif;font-size:15px;font-weight:500;}
  .daynav-mid .ds{display:block;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;}

  .iconbtn{background:none;border:none;padding:7px;margin:-7px;cursor:pointer;color:var(--ink3);
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;border-radius:8px;}
  .iconbtn:active{background:var(--paper);color:var(--ink);}

  i.ti{display:inline-flex;align-items:center;justify-content:center;line-height:0;}
  i.ti svg{width:1em;height:1em;display:block;}

  .brow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px;}
  .brow + .brow{border-top:1px dashed var(--line);}
  .brow .bl{display:flex;align-items:center;gap:6px;min-width:92px;color:var(--ink2);}
  .brow .bl i{font-size:15px;color:var(--ink3);}
  .brow .bbar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
  .brow .bbar span{display:block;height:100%;background:var(--sage);border-radius:99px;}
  .brow .bv{font-variant-numeric:tabular-nums;min-width:66px;text-align:right;}

  .steplabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
    font-weight:500;margin:0 0 8px;display:flex;align-items:center;gap:7px;}
  .steplabel::after{content:'';flex:1;height:1px;background:var(--line);}

  .catrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px;}
  .catchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:10px 4px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    color:var(--ink2);font-size:11.5px;font-family:'Inter',sans-serif;cursor:pointer;line-height:1;}
  .catchip i{font-size:18px;color:var(--cc);opacity:.55;}
  .catchip.on{background:var(--ct);border-color:var(--cc);color:var(--cc);font-weight:600;box-shadow:0 0 0 1px var(--cc);}
  .catchip.on i{opacity:1;}

  .amtbox{display:flex;align-items:center;gap:6px;background:var(--paper);
    border:2px solid var(--ink);border-radius:15px;padding:12px 14px;margin-bottom:14px;}
  .amtbox input{border:none!important;background:transparent;padding:0;flex:1;min-width:0;
    font-family:'Fraunces',serif;font-size:33px;font-weight:500;text-align:center;
    color:var(--ink);letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
  .amtbox input:focus{outline:none;box-shadow:none!important;}
  .amtbox input::placeholder{color:var(--line2);}
  .amtbox .cur{font-size:12px;color:var(--ink3);letter-spacing:.05em;flex-shrink:0;}
  .amtbox .clr{background:none;border:none;cursor:pointer;color:var(--ink3);padding:4px;flex-shrink:0;font-size:17px;
    display:inline-flex;}

  .entry .cat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
    padding:3px 8px;border-radius:7px;flex-shrink:0;}
  .entry .cat i{font-size:12px;}

  .monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .monthnav .name{font-family:'Fraunces',serif;font-size:17px;font-weight:500;}
  .navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);}
  .navbtn:disabled{opacity:.3;cursor:default;}
  .navbtn i{font-size:17px;}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
  .dow div{text-align:center;font-size:11px;color:var(--ink3);font-weight:500;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cell{aspect-ratio:1;border-radius:9px;background:var(--paper);border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:2px;}
  .cell.blank{background:transparent;cursor:default;}
  .cell .d{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1;}
  .cell .a{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:1;}
  .cell.under{background:var(--sage-bg);}
  .cell.under .d{color:#2C513E;font-weight:500;}
  .cell.under .a{color:var(--sage);}
  .cell.big{background:var(--brass-bg);}
  .cell.big .d{color:#78561F;font-weight:500;}
  .cell.big .a{color:var(--brass);}
  .cell.today{border-color:var(--ink);}
  .cell.sel{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-bg);}
  .cell.future{opacity:.45;}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:12px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

  .daypanel{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;}
  .daypanel .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .daypanel .dh .t{font-family:'Fraunces',serif;font-size:15px;font-weight:500;}
  .daypanel .dh .s{font-size:12.5px;color:var(--ink3);}
  .entry{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;}
  .entry + .entry{border-top:1px dashed var(--line);}
  .entry .amt{font-variant-numeric:tabular-nums;font-weight:500;min-width:78px;}
  .entry .note{flex:1;color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry i{font-size:16px;color:var(--ink3);cursor:pointer;flex-shrink:0;}
  .empty{font-size:13px;color:var(--ink3);padding:6px 0 10px;}

  .billrow{display:flex;gap:7px;align-items:center;margin-bottom:7px;}
  .billrow .bn{flex:2;}
  .billrow .ba{flex:1.3;}
  .billrow i{font-size:17px;color:var(--ink3);cursor:pointer;flex-shrink:0;padding:2px;}
  .addbill{font-size:13px;color:var(--sage);background:none;border:none;padding:4px 0 0;cursor:pointer;
    display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;}

  .steps{display:flex;gap:5px;margin-bottom:20px;}
  .steps div{flex:1;height:3px;border-radius:99px;background:var(--line);}
  .steps div.on{background:var(--sage);}
  .setup-lead{font-size:14px;color:var(--ink2);line-height:1.6;margin:0 0 18px;}
  .flabel{display:block;font-size:12.5px;color:var(--ink2);margin:16px 0 7px;font-weight:450;}
  .fhint{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5;}

  .yearnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .yearnav .y{font-family:'Fraunces',serif;font-size:16px;font-weight:500;}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .mtile{padding:12px 4px;border-radius:11px;border:1px solid var(--line2);background:var(--card);
    text-align:center;font-size:13.5px;cursor:pointer;color:var(--ink2);font-family:'Inter',sans-serif;}
  .mtile.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:500;}

  .preview{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;}
  .preview .l{font-size:12.5px;color:var(--ink2);}
  .preview .v{font-family:'Fraunces',serif;font-size:21px;font-weight:500;color:var(--sage);font-variant-numeric:tabular-nums;}
  .preview.bad .v{color:#9A4A2E;font-size:14px;font-family:'Inter',sans-serif;}

  .navbtns{display:flex;gap:8px;margin-top:20px;}
  .navbtns .btn{flex:1;}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding:7px 10px calc(7px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;
    color:var(--ink3);font-family:'Inter',sans-serif;font-size:10.5px;cursor:pointer;padding:5px;}
  .tab i{font-size:20px;}
  .tab.on{color:var(--sage);}

  .err{color:#9A4A2E;font-size:12.5px;margin-top:8px;display:none;line-height:1.5;}
  .err.show{display:block;}
  .confirm{display:none;margin-top:10px;}
  .confirm.open{display:block;}
</style>
</head>
<body>

<div id="app"></div>
<div class="tabbar" id="tabbar" style="display:none;">
  <button class="tab on" data-s="today"><i class="ti ti-flame"></i>Today</button>
  <button class="tab" data-s="calendar"><i class="ti ti-calendar-month"></i>Calendar</button>
  <button class="tab" data-s="settings"><i class="ti ti-adjustments"></i>Settings</button>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function syncBills(){
  const rows=[].slice.call(document.querySelectorAll('.billrow'));
  const bills=rows.map(r=>({name:r.querySelector('.bn').value.trim()||'Untitled',
                            amount:money(r.querySelector('.ba').value)}));
  const el=document.getElementById('billTotal');
  if(el) el.textContent=fmt(bills.reduce((s,b)=>s+b.amount,0));
  if(wiz&&wiz.draft) wiz.draft.lockedBills=bills;
  return bills;
}

const ICONS={
'ti-chevron-left':'<path d="M15 6l-6 6 6 6"/>',
'ti-chevron-right':'<path d="M9 6l6 6-6 6"/>',
'ti-arrow-down-right':'<path d="M7 7l10 10M17 9v8h-8"/>',
'ti-moon':'<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>',
'ti-pencil-plus':'<path d="M4 20h4L18 10a2.8 2.8 0 0 0-4-4L4 16v4M13.5 6.5l4 4M16 19h6M19 16v6"/>',
'ti-list':'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
'ti-shield-check':'<path d="M12 3l7 3v6c0 4-3 7.2-7 9-4-1.8-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
'ti-trash':'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>',
'ti-x':'<path d="M6 6l12 12M18 6L6 18"/>',
'ti-plus':'<path d="M12 5v14M5 12h14"/>',
'ti-flame':'<path d="M12 2c3 4 5 6.5 5 9.5a5 5 0 0 1-10 0c0-2 .8-3.2 2-4.2 0 2 1 3 2 3s-2-4.8 1-8.3z"/>',
'ti-calendar-month':'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',
'ti-adjustments':'<path d="M5 6h8M18 6h1M5 12h3M13 12h6M5 18h8M18 18h1M13 4v4M8 10v4M13 16v4"/>',
'ti-lock':'<path d="M6 11h12v9H6zM9 11V7.5a3 3 0 0 1 6 0V11"/>',
'ti-coin':'<circle cx="12" cy="12" r="9"/><path d="M14.5 9H11a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9.5M12 7v10"/>',
'ti-info-circle':'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',
'ti-chart-donut':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M19.8 15.5l-4.7-1.6"/>',
'ti-check':'<path d="M5 12l5 5L20 7"/>',
'ti-bowl':'<path d="M3 11h18a9 9 0 0 1-18 0zM7 8c0-2 1.5-2.5 2.5-3.5M12 8c0-2 1.5-2.5 2.5-3.5"/>',
'ti-shopping-cart':'<circle cx="8" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/><path d="M3 4h2l2.4 10.5h10L20 7H6"/>',
'ti-shopping-bag':'<path d="M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2"/>',
'ti-parking':'<path d="M8 20V4h4.5a4.5 4.5 0 0 1 0 9H8"/>',
'ti-gas-station':'<path d="M4 20V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15M3 20h12M6 8h5M13 10h3a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
'ti-dots':'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'
};
function paintIcons(){
  document.querySelectorAll('i.ti').forEach(el=>{
    if(el.dataset.ico)return;
    let name=null;
    el.classList.forEach(c=>{if(ICONS[c])name=c;});
    if(!name)return;
    el.dataset.ico='1';
    el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
  });
}

const CATS=[
  {id:'foods',label:'Foods',icon:'ti-bowl',c:'#C4552F',t:'#FAEDE7'},
  {id:'groceries',label:'Groceries',icon:'ti-shopping-cart',c:'#55832F',t:'#EDF3E6'},
  {id:'shopping',label:'Shopping',icon:'ti-shopping-bag',c:'#7A5AA6',t:'#F1ECF7'},
  {id:'parking',label:'Parking',icon:'ti-parking',c:'#37699B',t:'#E8F0F7'},
  {id:'fuel',label:'Fuel',icon:'ti-gas-station',c:'#B07A22',t:'#F8F0E0'},
  {id:'others',label:'Others',icon:'ti-dots',c:'#6B726C',t:'#EFF1EF'}
];
const catColor=id=>{const c=CATS.find(x=>x.id===id);return c?c.c:'#6B726C';};
const catTint=id=>{const c=CATS.find(x=>x.id===id);return c?c.t:'#EFF1EF';};
const catOf=e=>e.cat||'others';
const catLabel=id=>{const c=CATS.find(x=>x.id===id);return c?c.label:'Others';};
const catIcon=id=>{const c=CATS.find(x=>x.id===id);return c?c.icon:'ti-dots';};

const digits=s=>String(s).replace(/[^\d]/g,'');
const money=s=>{const d=digits(s);return d?parseInt(d,10):0;};
function wireMoney(){
  document.querySelectorAll('input.money').forEach(el=>{
    if(el.dataset.mw)return;el.dataset.mw='1';
    el.setAttribute('inputmode','numeric');
    el.addEventListener('input',()=>{
      const d=digits(el.value);
      el.value=d?parseInt(d,10).toLocaleString('de-DE'):'';
    });
  });
}

const SEED={income:24500000,savingsTarget:6000000,startingSavings:0,
  lockedBills:[
    {name:'Rent and utilities',amount:5000000},
    {name:'Fuel',amount:840000},
    {name:'Formal dates',amount:1200000},
    {name:'Parking',amount:450000},
    {name:'Haircut',amount:180000},
    {name:'Data',amount:125000}
  ]};

let config=null, meta=null, months={}, screen='today';
let viewMonth=null, selDay=null, curDay=null, selCat='foods';
let wiz={step:1,year:2026,month:null,draft:null};

function ensureDay(){
  const {y,m}=parseKey(viewMonth);
  const days=dim(y,m);
  if(curDay===null||curDay<1||curDay>days){
    curDay=(nowKey()===viewMonth)?new Date().getDate():1;
  }
}

function shiftDay(delta){
  const {y,m}=parseKey(viewMonth);
  const days=dim(y,m);
  let d=curDay+delta;
  if(d<1){
    const p=new Date(y,m-1,1);
    const pk=key(p.getFullYear(),p.getMonth());
    if(pk<config.startMonth) return;
    viewMonth=pk;curDay=dim(p.getFullYear(),p.getMonth());
  } else if(d>days){
    const n=new Date(y,m+1,1);
    viewMonth=key(n.getFullYear(),n.getMonth());curDay=1;
  } else curDay=d;
  render();
}

const fmt=n=>Math.round(n).toLocaleString('de-DE');
const short=n=>{n=Math.round(n);return n>=1000000?(n/1000000).toFixed(n%1000000===0?0:1)+'m':n>=1000?Math.round(n/1000)+'k':String(n);};
const key=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const nowKey=()=>{const d=new Date();return key(d.getFullYear(),d.getMonth());};
const parseKey=k=>{const[a,b]=k.split('-').map(Number);return{y:a,m:b-1};};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const firstDow=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
const iso=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

async function sGet(k){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
async function sSet(k,v){try{await window.storage.set(k,JSON.stringify(v));}catch(e){}}
async function sList(){try{const r=await window.storage.list('');return r&&r.keys?r.keys:[];}catch(e){return[];}}

function md(k){ if(!months[k]) months[k]={entries:[],draws:[]}; return months[k]; }
async function saveMonth(k){ await sSet('month:'+k,months[k]); }

function calc(k,forDay){
  const {y,m}=parseKey(k), days=dim(y,m), d=md(k);
  const locked=config.lockedBills.reduce((s,b)=>s+b.amount,0);
  const pool=config.income-locked-config.savingsTarget;
  const spent=d.entries.reduce((s,e)=>s+e.amount,0);
  const drawn=d.draws.reduce((s,x)=>s+x.amount,0);
  const real=new Date();
  const isNow=nowKey()===k;
  const today=isNow?real.getDate():null;
  let ref=forDay;
  if(!ref) ref=isNow?real.getDate():1;
  if(ref<1)ref=1; if(ref>days)ref=days;
  const daysLeft=days-ref+1;
  const daysGone=ref-1;
  const available=pool+drawn-spent;
  const perDay=Math.max(0,available/daysLeft);
  const byDay={};
  d.entries.forEach(e=>{const dd=+e.date.slice(8,10);
    if(!byDay[dd])byDay[dd]={total:0,snap:e.snap||0,items:[]};
    byDay[dd].total+=e.amount;byDay[dd].items.push(e);});
  const loggedDays=Object.keys(byDay).map(Number);
  const maxLogged=loggedDays.length?Math.max.apply(null,loggedDays):0;
  const elapsed=Math.max(maxLogged,ref-1);
  const avg=elapsed>0?spent/elapsed:0;
  let big=0,under=0;
  Object.keys(byDay).forEach(dd=>{byDay[dd].total>byDay[dd].snap?big++:under++;});
  return{y,m,days,ref,locked,pool,spent,drawn,available,perDay,daysLeft,daysGone,elapsed,avg,byDay,big,under,isNow,today};
}

async function boot(){
  config=await sGet('config');
  if(!config){renderWizard();return;}
  meta=await sGet('meta')||{savingsBalance:config.startingSavings||0,closed:[]};
  const keys=await sList();
  for(const k of keys){ if(k.indexOf('month:')===0){ months[k.slice(6)]=await sGet(k)||{entries:[],draws:[]}; } }
  const cur=nowKey();
  viewMonth = (cur>=config.startMonth)?cur:config.startMonth;
  await sweepClosed();
  document.getElementById('tabbar').style.display='flex';
  render();
}

async function sweepClosed(){
  const cur=nowKey();
  let changed=false;
  for(const k of Object.keys(months)){
    if(k<cur && meta.closed.indexOf(k)<0){
      const c=calc(k);
      meta.savingsBalance+=config.savingsTarget-c.drawn+c.available;
      meta.closed.push(k);changed=true;
    }
  }
  if(changed) await sSet('meta',meta);
}

function wireWizard(){
  const $=id=>document.getElementById(id);
  if(wiz.step===1){
    $('yPrev').onclick=()=>{wiz.year--;renderWizard();};
    $('yNext').onclick=()=>{wiz.year++;renderWizard();};
    document.querySelectorAll('.mtile').forEach(t=>t.onclick=()=>{wiz.month=t.dataset.k;renderWizard();});
    $('next1').onclick=()=>{
      const inc=money($('wIncome').value);
      if(!wiz.month||inc<=0){$('e1').classList.add('show');return;}
      wiz.draft.income=inc;wiz.step=2;renderWizard();
    };
  }
  if(wiz.step===2){
    const sync=syncBills;
    document.querySelectorAll('.billrow input').forEach(i=>i.addEventListener('input',sync));
    $('addBill').onclick=()=>{sync();wiz.draft.lockedBills.push({name:'',amount:0});renderWizard();};
    $('back2').onclick=()=>{sync();wiz.step=1;renderWizard();};
    $('next2').onclick=()=>{sync();wiz.draft.lockedBills=wiz.draft.lockedBills.filter(b=>b.amount>0);wiz.step=3;renderWizard();};
  }
  if(wiz.step===3){
    const upd=()=>{
      const sav=money($('wSav').value);
      const locked=wiz.draft.lockedBills.reduce((s,b)=>s+b.amount,0);
      const pool=wiz.draft.income-locked-sav;
      const {y,m}=parseKey(wiz.month);
      const per=pool/dim(y,m);
      const p=$('prev');
      if(pool<=0){p.classList.add('bad');$('prevV').textContent='Does not fit';}
      else{p.classList.remove('bad');$('prevV').textContent=fmt(per);}
    };
    $('wSav').oninput=upd;upd();
    $('back3').onclick=()=>{wiz.step=2;renderWizard();};
    $('done3').onclick=async()=>{
      const sav=money($('wSav').value);
      const start=money($('wStart').value);
      const locked=wiz.draft.lockedBills.reduce((s,b)=>s+b.amount,0);
      if(wiz.draft.income-locked-sav<=0){$('e3').classList.add('show');return;}
      config={income:wiz.draft.income,savingsTarget:sav,startingSavings:start,
        lockedBills:wiz.draft.lockedBills,startMonth:wiz.month};
      meta={savingsBalance:start,closed:[]};
      await sSet('config',config);await sSet('meta',meta);
      months={};viewMonth=(nowKey()>=wiz.month)?nowKey():wiz.month;
      document.getElementById('tabbar').style.display='flex';
      screen='today';render();
    };
  }
}

function breakdownCard(k){
  const d=md(k);
  if(!d.entries.length) return '';
  const tot=d.entries.reduce((s,e)=>s+e.amount,0);
  const by={};
  d.entries.forEach(e=>{const c=catOf(e);by[c]=(by[c]||0)+e.amount;});
  const rows=CATS.filter(ct=>by[ct.id]).sort((a,b)=>by[b.id]-by[a.id]).map(ct=>{
    const v=by[ct.id],p=Math.round(v/tot*100);
    return '<div class="brow"><span class="bl"><i class="ti '+ct.icon+'" style="color:'+ct.c+'"></i>'+ct.label+'</span>'+
      '<span class="bbar"><span style="width:'+p+'%;background:'+ct.c+'"></span></span>'+
      '<span class="bv">'+fmt(v)+'</span></div>';
  }).join('');
  return '<div class="card"><div class="card-head"><div class="lhs"><i class="ti ti-chart-donut"></i>Where it went</div>'+
    '<span style="font-variant-numeric:tabular-nums;">'+fmt(tot)+'</span></div>'+rows+'</div>';
}

function dayPanel(k,c,d){
  const {y,m}=parseKey(k),info=c.byDay[d];
  const dt=new Date(y,m,d);
  const label=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const items=info?info.items:[];
  return '<div class="daypanel"><div class="dh"><span class="t">'+label+'</span>'+
    '<span class="s">'+(info?fmt(info.total)+' spent':'nothing logged')+'</span></div>'+
    (items.length?items.map(e=>'<div class="entry"><span class="amt">'+fmt(e.amount)+'</span>'+
      '<span class="cat" style="background:'+catTint(catOf(e))+';color:'+catColor(catOf(e))+'"><i class="ti '+catIcon(catOf(e))+'"></i>'+catLabel(catOf(e))+'</span>'+
      '<span class="note">'+(e.note||'')+'</span><button class="iconbtn del" data-id="'+e.id+'"><i class="ti ti-trash"></i></button></div>').join('')
      :'<div class="empty">Nothing logged on this day.</div>')+
    '</div>';
}

function wireCal(){
  const $=id=>document.getElementById(id);
  const k=viewMonth,{y,m}=parseKey(k);
  $('pm').onclick=()=>{const p=new Date(y,m-1,1);viewMonth=key(p.getFullYear(),p.getMonth());selDay=null;render();};
  $('nm').onclick=()=>{const p=new Date(y,m+1,1);viewMonth=key(p.getFullYear(),p.getMonth());selDay=null;render();};
  document.querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>{
    const d=+c.dataset.d;selDay=(selDay===d)?null:d;
    if(selDay)curDay=selDay;
    render();
    if(selDay){const el=document.querySelector('.daypanel');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
  });
}

function setView(){
  const c=calc(viewMonth,curDay);
  return '<div class="wrap">'+
  '<div class="topbar"><div><div class="eyebrow">Pool</div><h1>Settings</h1></div></div>'+

  '<div class="card"><div class="card-head"><div class="lhs"><i class="ti ti-coin"></i>Money in</div></div>'+
  '<input id="sIncome" class="money" type="text" value="'+fmt(config.income)+'" /></div>'+

  '<div class="card"><div class="card-head"><div class="lhs"><i class="ti ti-lock"></i>Locked bills</div></div>'+
  '<div id="bills">'+config.lockedBills.map((b,i)=>billRow(b,i)).join('')+'</div>'+
  '<button class="addbill" id="addBill"><i class="ti ti-plus"></i>Add a bill</button>'+
  '<div class="kv total"><span>Locked each month</span><span class="v" id="billTotal">'+fmt(c.locked)+'</span></div></div>'+

  '<div class="card"><div class="card-head"><div class="lhs"><i class="ti ti-shield-check"></i>Savings</div></div>'+
  '<label class="flabel" style="margin-top:0;">Target each month</label>'+
  '<input id="sSav" class="money" type="text" value="'+fmt(config.savingsTarget)+'" />'+
  '<label class="flabel">Balance</label>'+
  '<input id="sBal" class="money" type="text" value="'+fmt(meta.savingsBalance)+'" /></div>'+

  '<div class="err" id="sErr">Bills and savings add up to more than you earn.</div>'+
  '<button class="btn solid" id="save" style="width:100%;margin-bottom:16px;">Save changes</button>'+

  '<div class="card"><div class="card-head"><div class="lhs"><i class="ti ti-trash"></i>Erase everything</div></div>'+
  '<div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:11px;">Deletes every entry, your savings history and your setup, then starts the wizard again.</div>'+
  '<button class="btn danger" id="eraseT" style="width:100%;">Erase everything</button>'+
  '<div class="confirm" id="eraseBox"><div class="fhint" style="margin-bottom:9px;">This cannot be undone.</div>'+
  '<button class="btn danger" id="eraseGo" style="width:100%;">Yes, erase everything</button></div></div>'+
  '</div>';
}

function wireSet(){
  const $=id=>document.getElementById(id);
  const sync=syncBills;
  document.querySelectorAll('.billrow input').forEach(i=>i.addEventListener('input',sync));
  $('addBill').onclick=()=>{
    const l=$('bills'),d=document.createElement('div');
    d.className='billrow';
    d.innerHTML='<input class="bn" type="text" placeholder="Name" /><input class="ba money" type="text" placeholder="0" /><button class="iconbtn rm"><i class="ti ti-x"></i></button>';
    l.appendChild(d);
    wireMoney();
    paintIcons();
    d.querySelectorAll('input').forEach(i=>i.addEventListener('input',sync));
    d.querySelector('.bn').focus();
  };
  $('save').onclick=async()=>{
    const inc=money($('sIncome').value);
    const sav=money($('sSav').value);
    const bal=money($('sBal').value);
    const bills=[...document.querySelectorAll('.billrow')].map(r=>({
      name:r.querySelector('.bn').value.trim()||'Untitled',
      amount:money(r.querySelector('.ba').value)})).filter(b=>b.amount>0);
    const locked=bills.reduce((s,b)=>s+b.amount,0);
    if(inc-locked-sav<=0){$('sErr').classList.add('show');return;}
    config.income=inc;config.savingsTarget=sav;config.lockedBills=bills;
    meta.savingsBalance=bal;
    await sSet('config',config);await sSet('meta',meta);
    screen='today';render();
  };
  $('eraseT').onclick=()=>$('eraseBox').classList.toggle('open');
  $('eraseGo').onclick=async()=>{
    const keys=await sList();
    for(const k of keys){try{await window.storage.delete(k);}catch(e){}}
    config=null;meta=null;months={};wiz={step:1,year:2026,month:null,draft:null};
    renderWizard();
  };
}

document.getElementById('tabbar').onclick=e=>{
  const b=e.target.closest('.tab');if(!b)return;
  screen=b.dataset.s;selDay=null;render();
};


document.addEventListener('click', async function(e){
  const t=e.target;
  if(!t||!t.closest) return;
  const rm=t.closest('.rm');
  if(rm){ const row=rm.closest('.billrow'); if(row){ row.remove(); syncBills(); } return; }
  const del=t.closest('.del');
  if(del){
    const id=del.getAttribute('data-id'), k=viewMonth;
    if(!k||!id) return;
    md(k).entries=md(k).entries.filter(en=>en.id!==id);
    await saveMonth(k); render(); return;
  }
});

paintIcons();
boot();
</script>
</body>
</html>
